# Place at: .github/workflows/snake.yml in your codersantoshadhikari/codersantoshadhikari repo
name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#00FF9D&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-dark.svg?palette=github-dark&color_snake=#00FF9D

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
